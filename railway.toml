# Railway deployment config for b3hub backend
# Docs: https://docs.railway.com/reference/railway-toml

[build]
buildCommand = "npm run build --workspace=apps/backend"

[deploy]
startCommand = "node --max-old-space-size=512 apps/backend/dist/main"
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 60
restartPolicyType = "on-failure"
restartPolicyMaxRetries = 3
