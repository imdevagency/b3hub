# Railway deployment config for b3hub backend
# Service root directory in Railway dashboard: apps/backend
# Docs: https://docs.railway.com/reference/railway-toml

[build]
# Install from repo root to respect npm workspaces, then build backend
buildCommand = "cd /app && npm ci && npm run build --workspace=apps/backend"

[deploy]
# preDeployCommand runs after build but before traffic switches over.
# DATABASE_URL and DIRECT_URL are available here as service variables.
preDeployCommand = "npx prisma migrate deploy"
# CWD at runtime is /app/apps/backend
startCommand = "node --max-old-space-size=512 dist/main"
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 60
