# Railway deployment config for b3hub backend
# Service root directory in Railway dashboard: apps/backend
# Build context for Dockerfile is always repo root; dockerfilePath is relative to service root.
# Docs: https://docs.railway.com/reference/railway-toml

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 60
restartPolicyType = "on-failure"
restartPolicyMaxRetries = 3
