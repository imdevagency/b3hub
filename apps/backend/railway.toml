# Railway deployment config for b3hub backend
# Service root directory in Railway dashboard: apps/backend
# Docs: https://docs.railway.com/reference/railway-toml

[build]
# Install from repo root to respect npm workspaces, then build backend.
# Explicit cd + direct npx avoids npm workspace CWD ambiguity.
buildCommand = "cd /app && npm ci && cd apps/backend && npx prisma generate && npx nest build"

[deploy]
# preDeployCommand runs after build but before traffic switches over.
# DATABASE_URL and DIRECT_URL must be set as Railway service variables.
preDeployCommand = "cd /app/apps/backend && npx prisma migrate deploy"
# Absolute path — CWD on Railway may vary.
startCommand = "node --max-old-space-size=512 /app/apps/backend/dist/main"
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 60
